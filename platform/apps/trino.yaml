# Helm chart trino from https://trinodb.github.io/charts
# targetRevision "*" takes the latest chart: pin it to a fixed version once the component works.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trino
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: lakehouse
  sources:
    - repoURL: https://trinodb.github.io/charts
      chart: trino
      targetRevision: "*"
      helm:
        valueFiles:
          - $values/platform/components/trino/values.yaml
    - repoURL: https://github.com/<your-account>/data-platform-poc.git
      targetRevision: main
      ref: values
  syncPolicy:
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
