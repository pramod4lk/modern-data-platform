# Helm chart keycloakx from https://codecentric.github.io/helm-charts
# targetRevision "*" takes the latest chart: pin it to a fixed version once the component works.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: identity
  sources:
    - repoURL: https://codecentric.github.io/helm-charts
      chart: keycloakx
      targetRevision: "*"
      helm:
        valueFiles:
          - $values/platform/components/keycloak/values.yaml
    - repoURL: https://github.com/<your-account>/data-platform-poc.git
      targetRevision: main
      ref: values
  syncPolicy:
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
