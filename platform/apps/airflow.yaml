# Helm chart airflow from https://airflow.apache.org
# targetRevision "*" takes the latest chart: pin it to a fixed version once the component works.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: orchestration
  sources:
    - repoURL: https://airflow.apache.org
      chart: airflow
      targetRevision: "*"
      helm:
        valueFiles:
          - $values/platform/components/airflow/values.yaml
    - repoURL: https://github.com/<your-account>/data-platform-poc.git
      targetRevision: main
      ref: values
  syncPolicy:
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
