# OpenMetadata dependencies: only OpenSearch.
# MySQL is replaced by the shared PostgreSQL; the bundled Airflow is disabled (our Airflow runs ingestion).
mysql:
  enabled: false
airflow:
  enabled: false
opensearch:
  enabled: true
  singleNode: true
  opensearchJavaOpts: "-Xms768m -Xmx768m"
  resources:
    requests: { cpu: 250m, memory: 1536Mi }
    limits: { memory: 1792Mi }
  nodeSelector:
    poc/role: services
  persistence:
    size: 10Gi
