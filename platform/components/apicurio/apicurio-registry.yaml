# Apicurio Registry (schema registry + data contract artefacts).
# POC uses in-memory storage: re-register schemas from data/contracts/schemas/ after a restart.
# Target design: SQL (PostgreSQL) or KafkaSQL storage. Verify the image tag before syncing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio-registry
  namespace: data-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: apicurio-registry }
  template:
    metadata:
      labels: { app: apicurio-registry }
    spec:
      nodeSelector:
        poc/role: services
      containers:
        - name: registry
          image: quay.io/apicurio/apicurio-registry:3.0.6
          ports:
            - containerPort: 8080
          env:
            - { name: QUARKUS_HTTP_CORS_ORIGINS, value: "*" }
            - { name: JAVA_OPTS_APPEND, value: "-Xms128m -Xmx384m" }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio-registry
  namespace: data-system
spec:
  selector: { app: apicurio-registry }
  ports:
    - port: 8080
      targetPort: 8080
