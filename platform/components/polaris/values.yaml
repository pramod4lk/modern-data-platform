# Apache Polaris (Iceberg REST catalog).
# Chart keys change between releases: compare with `helm show values` for your chart version before syncing.
image:
  pullPolicy: IfNotPresent
persistence:
  type: relational-jdbc
  relationalJdbc:
    secret:
      name: polaris-db            # keys: username, password, jdbcUrl
nodeSelector:
  kubernetes.io/hostname: k3s-server
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 768Mi }
# After first start:
#  1. Bootstrap the realm and root credentials (Polaris admin tool "bootstrap").
#  2. Create catalog "lakehouse" from create-catalog.json.
#  3. Create principal "poc-engine" with a principal role granting catalog access, and store its
#     client id/secret in Secret "polaris-engine" in namespaces lakehouse, streaming and orchestration.
