# codecentric/keycloakx chart. Admin and DB passwords come from Secrets (platform/secrets/README.md).
command:
  - "/opt/keycloak/bin/kc.sh"
  - "start"
  - "--http-enabled=true"
  - "--http-port=8080"
  - "--hostname-strict=false"
database:
  vendor: postgres
  hostname: pg-rw.data-system.svc.cluster.local
  port: 5432
  database: keycloak
  username: keycloak
  existingSecret: pg-keycloak
  existingSecretKey: password
extraEnv: |
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
  - name: JAVA_OPTS_APPEND
    value: "-Xms256m -Xmx512m"
nodeSelector:
  poc/role: services            # moved off k3s-server (3 GB VM) to fit the 16 GB Linux host
resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { memory: 768Mi }
# Import realm-poc.json in the admin console (Create realm -> Browse). Client secrets are generated by Keycloak.
