# Trino as a single node (coordinator also runs queries) on k3s-worker-2.
# Why: k3s-worker-1 (6 GB, on the 16 GB Linux laptop) is reserved for Spark.
# Target design: separate coordinator and worker pools per workload class.
server:
  workers: 0
  config:
    query:
      maxMemory: "1GB"
additionalConfigProperties:
  - node-scheduler.include-coordinator=true
coordinator:
  jvm:
    maxHeapSize: "2G"
  config:
    query:
      maxMemoryPerNode: "1GB"
  resources:
    requests: { cpu: 500m, memory: 2560Mi }
    limits: { memory: 2560Mi }
  nodeSelector:
    poc/role: services
envFrom:
  - secretRef: { name: s3-credentials }        # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
  - secretRef: { name: polaris-engine }        # POLARIS_CLIENT_ID / POLARIS_CLIENT_SECRET
catalogs:
  iceberg: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://polaris.data-system.svc.cluster.local:8181/api/catalog
    iceberg.rest-catalog.warehouse=lakehouse
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_CLIENT_ID}:${ENV:POLARIS_CLIENT_SECRET}
    iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
    fs.native-s3.enabled=true
    s3.endpoint=http://192.168.1.203:8080
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
    s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
  tpch: |
    connector.name=tpch
