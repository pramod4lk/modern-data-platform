# Apache Superset. Metadata DB: shared PostgreSQL. Secrets: see platform/secrets/README.md.
postgresql:
  enabled: false
redis:
  enabled: true
  master:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
supersetNode:
  connections:
    db_host: pg-rw.data-system.svc.cluster.local
    db_port: "5432"
    db_user: superset
    db_name: superset
    # db_pass comes from extraSecretEnv / existing secret; never commit it.
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1Gi }
nodeSelector:
  poc/role: services
bootstrapScript: |
  #!/bin/bash
  pip install --no-cache-dir "trino[sqlalchemy]" psycopg2-binary Authlib
init:
  loadExamples: false
supersetWorker:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }
# Trino connection string to add in the UI:  trino://superset@trino.lakehouse.svc.cluster.local:8080/iceberg
