# Rendered by Airflow for each run of reference_daily. Image: images/spark/Dockerfile.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: load-reference-{{ ts_nodash | lower }}
  namespace: lakehouse
spec:
  type: Python
  mode: cluster
  image: <registry>/poc-spark:0.1.0
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/poc/pipelines/spark/load_reference.py
  sparkVersion: "3.5.6"
  restartPolicy:
    type: Never
  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark-operator-spark
    nodeSelector: { poc/role: compute }
    envFrom:
      - secretRef: { name: s3-credentials }
      - secretRef: { name: polaris-engine }
  executor:
    instances: 1
    cores: 1
    memory: 1200m          # driver 1g + executor 1.2g (+ overhead) fit the 6 GB compute VM
    nodeSelector: { poc/role: compute }
    envFrom:
      - secretRef: { name: s3-credentials }
      - secretRef: { name: polaris-engine }
